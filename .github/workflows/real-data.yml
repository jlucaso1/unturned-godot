name: Real data

# ci.yml is deliberately hermetic: it never has the game, so every data-backed test self-skips there
# and only the pure-logic half is proven. This workflow is the other half. It fetches the content from
# Unturned's dedicated server (anonymous Steam download, nothing committed or redistributed) and runs
# the same suite against it, so the parsers are checked against the bytes the game actually ships.
#
# Content lands in build/game-data, which is git-ignored, and is cached between runs keyed on the
# depot manifest IDs, so a run only re-downloads when Valve ships an update.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a game update that breaks a parser surfaces on its own rather than on the next PR.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-data:
    name: tests against real content
    runs-on: ubuntu-latest
    # fetch-game-data.sh retries the Steam connection eight times with no per-attempt timeout, so a CM
    # outage would otherwise burn the 360-minute default before failing.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The downloader is pinned by version and checksum inside the script, so keying its cache on the
      # script's own hash is exact: edit the pin, get a fresh tool.
      - name: Cache DepotDownloader
        uses: actions/cache@v6
        with:
          path: build/tools
          key: depotdownloader-${{ hashFiles('scripts/fetch-game-data.sh') }}

      # The depot manifest IDs change exactly when the game updates, so they make a cache key that is
      # precise rather than time-based: same content, same key, no re-download.
      - name: Resolve the content cache key
        id: content-key
        run: echo "key=$(./scripts/fetch-game-data.sh --manifest-key)" >> "$GITHUB_OUTPUT"

      # Restore and save are split on purpose. actions/cache skips its teardown save after an exact-key
      # hit, so repairing a bad entry in place would fix this run and then throw the repair away — every
      # later run would restore the same bad entry and download the game again. Saving under a run-scoped
      # key and restoring by prefix means the next run finds the repair, not the entry it replaced.
      #
      # The receipt format is part of the verification contract. Bump this namespace when that contract
      # changes so old entries without a complete-map receipt cannot be reused. Nothing is ever saved
      # under the bare prefix, so `key` never hits exactly; restore-keys is what actually resolves it.
      - name: Restore the game content
        uses: actions/cache/restore@v6
        with:
          path: build/game-data
          key: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-
          restore-keys: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-

      # A cache hit is a claim, not a fact: GitHub caches are immutable for a key, so an entry saved
      # before the verification contract tightened stays restorable forever under a key that is still
      # current. Ask the fetcher whether what came back is whole, and download when it is not, rather
      # than wedging every run until the depot moves or someone deletes the entry by hand.
      - name: Fetch the game content
        id: content
        run: |
          if ./scripts/fetch-game-data.sh --verify 2> /dev/null; then
            echo "Restored content verified; skipping the download."
          else
            ./scripts/fetch-game-data.sh
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi

      # Only after a download: an untouched restore has nothing new to store. The job suffix keeps the
      # two jobs from reserving one key in the same run, and losing that race is not worth failing a job
      # whose content is already verified — the other job is storing the same tree.
      - name: Save the game content
        if: steps.content.outputs.downloaded == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: build/game-data
          key: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-${{ github.run_id }}-${{ github.job }}

      # Every data-backed test self-skips when the content is missing, which would leave this whole
      # job green while proving nothing. Fail loudly instead.
      - name: Verify the content is really there
        run: ./scripts/fetch-game-data.sh --verify

      - name: Build
        run: dotnet build unturned-godot.sln -c Release -warnaserror

      # UG_REQUIRE_REAL_DATA turns [RealDataFact]'s skip off. This job exists to prove the data-backed
      # tests actually ran, so a missing map or bundle has to fail here rather than quietly vanish from
      # the run the way `if (path == null) return;` used to let it.
      - name: Test
        env:
          UNTURNED_PATH: ${{ github.workspace }}/build/game-data
          UG_REQUIRE_REAL_DATA: '1'
        run: dotnet test tests/UnturnedGodot.Tests.csproj -c Release --no-build

      # The coverage gate lives in ci.yml too, but it runs there without the game: re-running it here
      # proves the real-content paths do not drag the numbers below the bar either.
      - name: Enforce core coverage above 95%
        env:
          UNTURNED_PATH: ${{ github.workspace }}/build/game-data
          UG_REQUIRE_REAL_DATA: '1'
        run: ./scripts/check-coverage.sh --no-build --no-restore

  web-layer:
    # web/ reads a real Unturned install through the browser's directory picker, which is how a web build
    # would get the game's content without anybody shipping it. It has no C# and no Godot in it, but it
    # does have opinions about what an install looks like — the same ones UnturnedInstall, ContentSource
    # and MapCatalog have — so it is only worth anything when checked against the real tree. The suite
    # self-skips without the content or a browser, so it runs here rather than in ci.yml.
    name: browser file layer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # This job runs `npm install -g`, which executes package install scripts. Nothing after the
      # checkout needs Git authentication, so the token does not stay in the Git config where those
      # scripts could reach it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # For the .dat differential below, which builds a net10.0 project against core/. The hosted image
      # happens to carry an SDK today; what it carries tomorrow is not this repo's decision, and the
      # differential is set up to fail rather than skip here.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache DepotDownloader
        uses: actions/cache@v6
        with:
          path: build/tools
          key: depotdownloader-${{ hashFiles('scripts/fetch-game-data.sh') }}

      - name: Resolve the content cache key
        id: content-key
        run: echo "key=$(./scripts/fetch-game-data.sh --manifest-key)" >> "$GITHUB_OUTPUT"

      # Same receipt namespace and restore/save split as the jobs above; see the comments there.
      - name: Restore the game content
        uses: actions/cache/restore@v6
        with:
          path: build/game-data
          key: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-
          restore-keys: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-

      - name: Fetch the game content
        id: content
        run: |
          if ./scripts/fetch-game-data.sh --verify 2> /dev/null; then
            echo "Restored content verified; skipping the download."
          else
            ./scripts/fetch-game-data.sh
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the game content
        if: steps.content.outputs.downloaded == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: build/game-data
          key: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-${{ github.run_id }}-${{ github.job }}

      # Playwright is a developer tool, not a dependency: this repo has no package.json and wants none,
      # so it is installed globally for the run and web/test/run.mjs resolves it from there. Pinned
      # exactly, because the version also decides which Chromium revision the suite runs against — an
      # unpinned install would let a registry release change what this job proves, with no commit here.
      - name: Install Playwright's Chromium
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium

      # The suite exits 0 when it finds no content or no browser, which would leave this job green while
      # proving nothing. Both are installed above, so demand that it actually ran.
      - name: Run the browser file layer suite
        env:
          UNTURNED_PATH: ${{ github.workspace }}/build/game-data
        run: |
          # The runner's shell is `bash -e` without pipefail, so without this a failing suite would be
          # masked by tee's exit status.
          set -o pipefail
          node web/test/run.mjs | tee "$RUNNER_TEMP/web-suite.log"
          if grep -q '^SKIP:' "$RUNNER_TEMP/web-suite.log"; then
            echo "The suite skipped; it was supposed to run."
            exit 1
          fi

      # The .dat reader is a port of core/Dat/DatParser.cs, so it is checked against that parser rather
      # than against a fixture: thousands of generated documents through both, top-level values compared.
      # It self-skips without the .NET SDK, which this job has.
      - name: Check the .dat port against the game's parser
        run: |
          set -o pipefail
          node web/test/differential.mjs | tee "$RUNNER_TEMP/dat-differential.log"
          if grep -q 'skipped' "$RUNNER_TEMP/dat-differential.log"; then
            echo "The differential skipped; it was supposed to run."
            exit 1
          fi

      # catalog.js mirrors four more types — UnturnedInstall, ContentSource, MapCatalog and LevelInfo —
      # and had no differential at all. The suite above is the only thing that covered it, against the
      # one real install the dedicated server ships: every map there is well-formed and there are no
      # workshop items in it, so agreement there says nothing about the shapes that actually separate
      # the two. This generates those (no Level.dat, a name that is only whitespace, tile filenames
      # spelled four wrong ways, a stale bundled copy standing in for a subscription), materializes each
      # on disk, and runs core/ and the browser over the same bytes. Self-skips without the .NET SDK.
      - name: Check the browser's catalogue against the desktop's
        run: |
          set -o pipefail
          node web/test/catalog-differential.mjs | tee "$RUNNER_TEMP/catalog-differential.log"
          if grep -q 'skipped' "$RUNNER_TEMP/catalog-differential.log"; then
            echo "The catalogue differential skipped; it was supposed to run."
            exit 1
          fi

      # The casing tables are exceptions to JavaScript's built-ins, so they rot when either runtime's
      # Unicode version moves. This compares them against the BCL over every code point. It runs under
      # Node rather than in the browser on purpose: Chromium's ICU is behind, and does not know some of
      # the mappings the table exists to override.
      - name: Check the casing tables against the BCL
        run: |
          set -o pipefail
          node web/test/casing.mjs | tee "$RUNNER_TEMP/casing.log"
          if grep -q 'skipped' "$RUNNER_TEMP/casing.log"; then
            echo "The casing check skipped; it was supposed to run."
            exit 1
          fi

  structural:
    # The tests prove the parsers read the right bytes; nothing proves the world they build keeps its
    # shape. This runs the structural benchmark tier and gates its counts — meshes and materials
    # surviving deduplication, scene nodes, uploaded geometry — so a batching, culling or dedup change
    # that quietly alters the render graph shows up as a diff instead of as a surprise on someone's
    # frame time. Timings are deliberately not gated: see scripts/check-structural-metrics.sh.
    name: structural metrics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Both tools are pinned by version and checksum in their scripts, so the scripts' hashes are an
      # exact key for what lands in build/tools.
      - name: Cache the downloader and Godot
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-${{ hashFiles('scripts/fetch-game-data.sh', 'scripts/install-godot.sh') }}

      - name: Resolve the content cache key
        id: content-key
        run: echo "key=$(./scripts/fetch-game-data.sh --manifest-key)" >> "$GITHUB_OUTPUT"

      # Same receipt namespace, and the same restore/save split, as the real-data job: both read the tree
      # through the same verifier, so both have to stop reusing entries that predate a change to what
      # "whole" means, and both have to keep the repair when they make one.
      - name: Restore the game content
        uses: actions/cache/restore@v6
        with:
          path: build/game-data
          key: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-
          restore-keys: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-

      # As in the real-data job: verify what the cache handed back instead of trusting the hit. Without
      # this, one bad entry under a still-current key would fail run-benchmark.sh on every run of this
      # job, with no way to replace it — cache entries are immutable for a given key.
      - name: Fetch the game content
        id: content
        run: |
          if ./scripts/fetch-game-data.sh --verify 2> /dev/null; then
            echo "Restored content verified; skipping the download."
          else
            ./scripts/fetch-game-data.sh
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the game content
        if: steps.content.outputs.downloaded == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: build/game-data
          key: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-${{ github.run_id }}-${{ github.job }}

      # The first run walks the masterbundle to extract every mesh and texture the map needs, which is
      # the better part of a minute. What it writes is a function of the bundle *and* of the code that
      # reads it: the on-disk caches validate themselves against a format magic and the bundle's stamp,
      # neither of which moves when extraction logic changes, so keying on the manifest IDs alone would
      # let a stale tree satisfy the very gate that is supposed to notice. The core and rendering/world
      # producers are the coarse but safe key — over-invalidating costs a minute, under-invalidating
      # costs a false green.
      - name: Restore the extracted asset cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/app_userdata/unturned-godot
          key: godot-userdata-${{ steps.content-key.outputs.key }}-${{ hashFiles('core/**/*.cs', 'src/Rendering/**/*.cs', 'src/World/**/*.cs') }}

      # This tier renders nothing, so it needs no GPU and no display: --headless is enough, and the
      # installer's software-Vulkan half goes unused here.
      - name: Install Godot
        run: ./scripts/install-godot.sh

      - name: Check the structural metrics
        env:
          UNTURNED_PATH: ${{ github.workspace }}/build/game-data
          # Pinned to "no holiday", because the counts below it are placement counts and the holiday
          # gating is real: Halloween would add 31 objects, Christmas 336, and June turns on a
          # PRIDE_MONTH asset. Without the pin the recorded baseline is only true for the ~46 weeks a
          # year nothing is running, and this job would go red on October 20th having found nothing
          # wrong -- which is how a gate teaches people to ignore it. Recorded with the same pin.
          UG_HOLIDAY: None
        run: ./scripts/check-structural-metrics.sh

      # The runtime suite's other half. Most of what src/ does is decode the game's own bundle formats,
      # and those are re-implementations checked byte-for-byte against Unturned's — a synthetic file this
      # reader accepts would prove nothing about the reader. So those tests need the content, and this is
      # the job that has it.
      #
      # UG_REQUIRE_REAL_DATA=1 is the whole point: without it a test with nothing to read says so and
      # returns, which is right on a developer's machine and useless here. Set, a missing file FAILS,
      # so this job cannot go green by finding nothing.
      - name: Run the runtime suite against real content
        env:
          UNTURNED_PATH: ${{ github.workspace }}/build/game-data
          UG_REQUIRE_REAL_DATA: '1'
        run: ./scripts/run-godot-tests.sh

  src-coverage:
    # This was the last step of the structural job, and it was the workflow's clock: measured across two
    # runs of the same commit it took 10m16 and 10m13, out of jobs that took 19m20 and 19m35. The two
    # steps ahead of it — the structural gate and the runtime suite — spent about eight minutes between
    # them, and the other two jobs finish in under three, so everything else was already waiting on this.
    #
    # Nothing here feeds those steps and nothing they produce is read here: this runs the suite again
    # under coverlet from a clean checkout either way. Sequence was buying nothing but wall time, so it
    # runs alongside instead. Same content, same engine, same command, same reporting contract; the
    # workflow just stops finishing ten minutes after it has learned everything it gates on.
    name: src/ coverage with real content
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # OFF THE PULL REQUEST PATH.
    #
    # This job gates nothing — it is continue-on-error at both the job and the step level, and says so
    # at length below. It also costs up to 45 minutes and pulls the game content, and it ran on every
    # pull request beside three jobs that DO gate. Against a 16-second hermetic suite, essentially all
    # of that wall time was content and engine setup for a number with no floor under it.
    #
    # A weekly run and a button is the right cadence for a figure that is tracked rather than enforced.
    # What actually protects src/ on a pull request is the ratchet in ci.yml's runtime job, which
    # measures the same thing hermetically, in a job that was already running, and fails when the
    # number drops (see scripts/check-src-coverage.sh --ratchet).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Non-gating all the way up, not just on the report step. The preamble below used to be shared with
    # the structural work, so a Steam flake or a failed Godot install took down a job that was gating
    # something; split out, the same failure would redden the workflow over a job that gates nothing.
    # This keeps the run's verdict where it was before the split. It does NOT paper over the report
    # itself — that step carries its own continue-on-error, so it never reaches this and the job still
    # shows green when only the measurement failed. What this catches is exactly the setup.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Same key as the structural job: this needs both tools for the same reasons, and sharing the key
      # means the two jobs share one entry rather than each keeping a copy of a ~130 MB editor. On a cold
      # key both will try to save it and one will lose the reservation; actions/cache logs that and moves
      # on. That is the same race the content save already accepts, for the same reason: the other job is
      # storing the same bytes.
      - name: Cache the downloader and Godot
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-${{ hashFiles('scripts/fetch-game-data.sh', 'scripts/install-godot.sh') }}

      - name: Resolve the content cache key
        id: content-key
        run: echo "key=$(./scripts/fetch-game-data.sh --manifest-key)" >> "$GITHUB_OUTPUT"

      # Same receipt namespace and restore/save split as the jobs above; see the comments there.
      - name: Restore the game content
        uses: actions/cache/restore@v6
        with:
          path: build/game-data
          key: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-
          restore-keys: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-

      - name: Fetch the game content
        id: content
        run: |
          if ./scripts/fetch-game-data.sh --verify 2> /dev/null; then
            echo "Restored content verified; skipping the download."
          else
            ./scripts/fetch-game-data.sh
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the game content
        if: steps.content.outputs.downloaded == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: build/game-data
          key: unturned-content-receipt-v2-${{ steps.content-key.outputs.key }}-${{ github.run_id }}-${{ github.job }}

      # Restore-only, and the reason is what this job lost in the split. user://model_cache and
      # user://texture_cache are shared across every run in a job — measured after one local
      # --with-game-run: 15 MB of models, 3.3 MB of textures — and the structural benchmark used to fill
      # them before the coverage runs got here, so those runs read caches rather than extracting. Alone,
      # this job's first pass extracts cold and the rest read warm. That is a change in which paths the
      # reported figure exercises, so the cache comes along; the same key means it warms exactly when the
      # structural job's would have.
      #
      # No save: the structural job is the producer for this key, and two jobs writing one key is a race
      # over identical bytes.
      - name: Restore the extracted asset cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/share/godot/app_userdata/unturned-godot
          key: godot-userdata-${{ steps.content-key.outputs.key }}-${{ hashFiles('core/**/*.cs', 'src/Rendering/**/*.cs', 'src/World/**/*.cs') }}

      # check-src-coverage.sh needs a Godot binary and the Debug assembly the engine loads. It builds the
      # assembly itself, but it only ever *looks up* the binary (`install-godot.sh --print-path`) and
      # fails when it is not there — so the install runs as its own step rather than being left to a
      # cache hit that a change to install-godot.sh would take away.
      - name: Install Godot
        run: ./scripts/install-godot.sh

      # Reported, not gated. src/ is being brought under measurement file by file (see
      # check-src-coverage.sh), and this is the number with the content present — the hermetic job's
      # figure is the same measurement with every content-dependent test skipped.
      #
      # --with-game-run is only meaningful here: it measures ONE real session on top of the suite, which
      # is the only way to see the parts of src/ that end the process rather than return (Main.cs, the
      # benchmark tiers). It needs the content, so the hermetic job cannot ask for it.
      #
      # continue-on-error because the sentence above is the contract: this number is reported, not gated.
      # --with-game-run adds real sessions on top of the suite, and a session that wedges or a mode that
      # exits badly must not turn a PR red over a figure that has no floor yet.
      #
      # Kept here as well as on the job, because the two mean different things. This one absorbs a failed
      # MEASUREMENT and leaves the job green, which is what it did before the split and is the state a
      # reader should see when the setup was fine. The job-level one absorbs a failed SETUP, which the
      # split newly made possible; that case is worth showing as a failed job, and does not reach here.
      - name: Report src/ coverage with real content
        continue-on-error: true
        env:
          UNTURNED_PATH: ${{ github.workspace }}/build/game-data
          UG_REQUIRE_REAL_DATA: '1'
        run: ./scripts/check-src-coverage.sh --files --with-game-run
